# Carried over from a pre-existing manual kitty setup on one machine (see
# PR discussion) — real app config, not theming, so it stays here rather
# than in the rice template.
font_family JetBrainsMono Nerd Font
font_size 12.0
disable_ligatures never
cursor_shape underline
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
allow_remote_control yes
keyboard_protocol none
map ctrl+shift+r set_tab_title

# Theme
include ~/.rice/kitty/theme.conf

# Reloads this file (and the theme.conf it includes) into every open kitty
# window as soon as it changes on disk — no signal or restart needed, unlike
# foot. This is the whole reason kitty is now the primary terminal.
reload_config_on_change yes
