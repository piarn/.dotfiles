# Read by pam_systemd/systemd --user before sway starts, so GTK/Qt/Xwayland
# apps inherit it at launch. Without it, hovering images/canvas in Chromium
# and similar apps makes the pointer vanish instead of falling back to a
# default arrow — see the `seat seat0 xcursor_theme` line in
# ~/.config/sway/config for the matching wlroots-side setting.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
