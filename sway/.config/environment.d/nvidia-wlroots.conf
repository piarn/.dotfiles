# Works around NVIDIA/wlroots cursor-plane corruption on sway (hybrid
# Intel+NVIDIA laptops): windows that repaint partial regions via
# canvas/WebGL (e.g. Kaneo's board UI) can flash green/garbled where the
# hardware cursor plane overlaps. Forces wlroots to composite the cursor in
# software instead of using the GPU's cursor plane.
#
# Must live in environment.d (read by systemd --user at login, before sway
# starts) rather than an `exec_always` in sway/config — wlroots reads this
# at backend init, which is too early for an in-session exec to affect.
WLR_NO_HARDWARE_CURSORS=1
