# Read by pam_systemd/systemd --user before sway starts, so anything sway's
# own `exec`/`bindsym ... exec` launches inherits this PATH. Sway's exec
# runs in the compositor's process env (the systemd user session), not an
# interactive login shell, so fish's `fish_add_path` calls in config.fish
# never reach it — binaries under ~/.local/bin (satty, yazi, ...) are
# invisible to bindsym execs without this. See cursor.conf in this same
# directory for the same mechanism applied to XCURSOR_*.
PATH=${HOME}/.local/bin:${HOME}/bin:${HOME}/go/bin:${PATH}:${HOME}/.local/share/mise/shims
# mise's shims go last: for apps launched from sway they only fill in tools
# the distro doesn't have, and a shim with no version pinned for the
# directory errors instead of falling through. Terminals don't depend on
# this: fish's `mise activate` (conf.d/mise.fish) puts a project's pinned
# versions first.
