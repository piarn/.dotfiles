# vim-modes — key tables. Loaded by vim-modes.tmux via `source-file`, never by
# shelling out to `tmux bind-key ...`: action-chaining (`\;`) only survives
# tmux's own config parser. A shell invoking the tmux CLI treats an unescaped
# `;` as "run two separate top-level tmux commands now" rather than "bind one
# key to this multi-step action" (confirmed the hard way: a run-shell one-liner
# attempting this silently split into two commands and threw "no current
# client"). Only the option-dependent bindings live in vim-modes.tmux, and none
# of those are chained.
#
# Mode  ->  key table
#   INSERT  root          (tmux's real default table)
#   NORMAL  vim-normal    + tmux's own prefix table for the leader chord
#   VISUAL  copy-mode-vi  (tmux's real copy-mode)
#
# The leader is whatever key the `prefix` option was set to, and the commands
# behind it live in tmux's real `prefix` table — so stock bindings, other
# plugins' bindings and `list-keys -T prefix` all keep working. vim-modes.tmux
# reads the option, remembers the key and then sets `prefix` itself to None: the
# built-in prefix check only runs on the *default* key table, which here is
# INSERT, so leaving `prefix Space` set would eat the space bar while typing.
# NORMAL reaches the table through an ordinary binding instead (also set up in
# vim-modes.tmux, since the key is a user option).
#
# Why root is INSERT and not NORMAL, given NORMAL is the mode we start in:
# per `man tmux`, `switch-client -T` only holds for the very next keypress
# before falling back to whatever the `key-table` option names (root, unless
# overridden). If NORMAL were the configured default, INSERT would last exactly
# one keystroke before snapping back. So `key-table` stays unset (root), which
# makes INSERT sticky for free, and vim-normal becomes the non-default table
# that must explicitly re-arm `switch-client -T vim-normal` on every key it
# handles — including the `Any` catch-all — or it silently decays to INSERT.
#
# Why VISUAL must leave the client key table at root: tmux only routes keys to
# a pane's mode table (copy-mode-vi) while the client's key table is the
# *default* one. Re-arming vim-normal on entry to copy-mode would therefore
# make copy-mode entirely unusable — every key would land in the vim-normal
# catch-all instead of moving the cursor. Copy-mode is left on root, VISUAL is
# detected from `pane_mode` rather than from the key table, and the
# `pane-mode-changed` hook below is what returns you to NORMAL on the way out.

set -g mode-keys vi
set -g status-keys vi

# tmux assumes anything arriving faster than assume-paste-time (1ms by default)
# is a paste and skips key bindings for it entirely — which in a modal config
# means a pasted burst arriving while you're in NORMAL is typed straight into
# the shell instead of being swallowed (measured: 8 of 10 characters leaked).
# 0 disables the heuristic, so NORMAL holds no matter how fast input arrives.
# Pasting into INSERT is unaffected: root has no bindings for printable keys,
# so the characters reach the pane either way.
set -g assume-paste-time 0

# INSERT is for typing into the shell and nothing else, so the root table holds
# no key that runs a tmux command — the leader included (vim-modes.tmux parks
# `prefix` on None for exactly that reason). Escape is the way out.
#
# The one exception, and the reason there is one: Escape is forwarded untouched
# to panes running an editor that needs it for its own insert->normal
# transition, which would otherwise leave those panes with no way back to
# NORMAL at all. C-Space is that way out.
bind -n C-Space switch-client -T vim-normal

# Escape leaves INSERT, with two cases where it goes to the pane instead:
#
#   - an editor that needs Escape for its own insert->normal transition
#     (@vim-modes-vim-pane, built in vim-modes.tmux from the passthrough list).
#   - a pane in a chooser, the clock, or any other non-copy mode. Unlike
#     copy-mode, those modes have no populated key table of their own: tmux
#     hands them keys only by way of "unbound in the current table, so send it
#     to the pane". A root-table Escape binding therefore swallows their cancel
#     key and leaves the chooser stuck open with no way out. copy-mode is
#     unaffected — copy-mode-vi binds Escape itself and wins before root is
#     ever consulted.
bind -n Escape if -F "#{||:#{pane_in_mode},#{E:@vim-modes-vim-pane}}" \
    "send-keys Escape" \
    "switch-client -T vim-normal"

# Every client starts in NORMAL. A bare `switch-client -T` inside the hook
# (relying on implicit "current client" context) silently failed to stick on a
# real attach — confirmed via a real pty test, not guessed. It needs an
# explicit client target and a short delay to avoid racing tmux's own
# attach-completion, otherwise the switch is lost before the client is ready to
# hold it. (fish/.config/fish/conf.d/00-tmux-normal-mode.fish is a
# belt-and-suspenders backup for this same thing.)
set-hook -g client-attached 'run-shell -b "sleep 0.15 && tmux switch-client -t \"#{client_name}\" -T vim-normal"'

# ...and stays in NORMAL across a session switch. `switch-client -t <session>`
# resets the client's key table to the default, i.e. INSERT, so anything that
# moves a client between sessions silently changes the mode underneath you.
# tmux-continuum's auto-restore is the case that bites: it switches the client
# once per restored session at server start, which landed every fresh server in
# INSERT a beat after the client-attached hook above had correctly put it in
# NORMAL. Session choosers and `switch-client -n/-p` have the same effect.
set-hook -g client-session-changed 'switch-client -T vim-normal'

# VISUAL -> NORMAL, for every way out of copy-mode at once: Escape, q, Enter,
# y (tmux-yank's copy-pipe-and-cancel), a finished mouse drag. Binding each of
# those individually would miss whichever one a plugin rebinds later — and
# tmux-yank in particular is loaded by TPM *after* this file, so its `y` would
# win and drop you into INSERT, which requirement 3 forbids. Reacting to the
# mode ending catches all of them regardless of who bound the key.
set-hook -g pane-mode-changed 'if -F "#{==:#{pane_mode},}" "switch-client -T vim-normal"'

# ---------------------------------------------------------------------------
# NORMAL
# ---------------------------------------------------------------------------

# Catch-all. An unbound key in a non-default table makes tmux reset to the
# default table AND deliver the key there — i.e. it would both type the
# character into the pane and drop you into INSERT. `Any` swallows the key and
# re-arms NORMAL instead. Specific bindings still win over `Any`, so ordering
# within this file doesn't matter.
bind -T vim-normal Any switch-client -T vim-normal
bind -T vim-normal Escape switch-client -T vim-normal

# Pane navigation, on the keys vim moves with. When the pane is running vim or
# nvim the matching vim-tmux-navigator chord is handed over instead of moving
# the tmux pane, so a move crosses into a vim split and only falls through to
# the next tmux pane once vim runs out of splits in that direction. That is why
# the editor gets `C-h` and not a literal `h`: `h` would just walk its cursor.
bind -T vim-normal h if -F "#{E:@vim-modes-vim-pane}" "send-keys C-h" "select-pane -L" \; vim-modes-return
bind -T vim-normal j if -F "#{E:@vim-modes-vim-pane}" "send-keys C-j" "select-pane -D" \; vim-modes-return
bind -T vim-normal k if -F "#{E:@vim-modes-vim-pane}" "send-keys C-k" "select-pane -U" \; vim-modes-return
bind -T vim-normal l if -F "#{E:@vim-modes-vim-pane}" "send-keys C-l" "select-pane -R" \; vim-modes-return

# The same chord INSERT uses, so the muscle memory carries across modes.
bind -T vim-normal C-h if -F "#{E:@vim-modes-vim-pane}" "send-keys C-h" "select-pane -L" \; vim-modes-return
bind -T vim-normal C-j if -F "#{E:@vim-modes-vim-pane}" "send-keys C-j" "select-pane -D" \; vim-modes-return
bind -T vim-normal C-k if -F "#{E:@vim-modes-vim-pane}" "send-keys C-k" "select-pane -U" \; vim-modes-return
bind -T vim-normal C-l if -F "#{E:@vim-modes-vim-pane}" "send-keys C-l" "select-pane -R" \; vim-modes-return

# resize on the shifted keys (direct, chained — keep tapping to keep resizing,
# like vim's <C-w>+/-)
bind -T vim-normal H resize-pane -L 5 \; vim-modes-return
bind -T vim-normal J resize-pane -D 5 \; vim-modes-return
bind -T vim-normal K resize-pane -U 5 \; vim-modes-return
bind -T vim-normal L resize-pane -R 5 \; vim-modes-return

# The leader key itself is bound in vim-modes.tmux — it is whatever `prefix`
# was set to, so it can't be spelled out here.

# Mouse in NORMAL. These re-arm NORMAL where root would have left you in
# INSERT; the two that open copy-mode (drag-select, wheel-scroll) deliberately
# do not re-arm, because copy-mode needs the root key table (see header) — they
# are the mouse equivalent of `Space v`, and the pane-mode-changed hook returns
# you to NORMAL when the selection ends. The right-click menus are not mirrored
# from root; `Any` swallows them rather than letting them bounce you to INSERT.
bind -T vim-normal MouseDown1Pane select-pane -t = \; send-keys -M \; switch-client -T vim-normal
bind -T vim-normal MouseDown1Status select-window -t = \; switch-client -T vim-normal
bind -T vim-normal MouseDrag1Border resize-pane -M \; switch-client -T vim-normal
bind -T vim-normal WheelUpStatus previous-window \; switch-client -T vim-normal
bind -T vim-normal WheelDownStatus next-window \; switch-client -T vim-normal
bind -T vim-normal MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
bind -T vim-normal WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
bind -T vim-normal DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind -T vim-normal TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }

# ---------------------------------------------------------------------------
# The leader — tmux's own prefix table
# ---------------------------------------------------------------------------
#
# One key after the leader, then back to NORMAL. `vim-modes-return` is the
# command alias vim-modes.tmux defines for that trip back; it is conditional on
# the pane not having just entered a mode, because a command that opens
# copy-mode, a chooser or the clock needs the client left on root for that
# mode's own key table to be reachable (see the header) — pane-mode-changed
# returns those to NORMAL when the mode ends instead. Using the alias
# everywhere means each binding below reads as "do the thing, go back", with no
# per-command reasoning about which kind it is.
#
# vim-modes.tmux applies the same return to every binding already in this table
# — tmux's own defaults and other plugins' — so `prefix ?`, `prefix [` or
# resurrect's `prefix C-s` land back in NORMAL too, not in INSERT.

bind -T prefix Any switch-client -T vim-normal
bind -T prefix Escape switch-client -T vim-normal

# the two that leave NORMAL on purpose, and so take no return
bind -T prefix i switch-client -T root
bind -T prefix v copy-mode

bind -T prefix r source-file ~/.config/tmux/tmux.conf \; display "config reloaded" \; vim-modes-return
bind -T prefix S run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh' \; vim-modes-return
bind -T prefix R run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh' \; vim-modes-return

# splits, vim :split/:vsplit mnemonics (s = horizontal split, V = vertical —
# lowercase v is taken by "enter VISUAL")
bind -T prefix s split-window -v -c "#{pane_current_path}" \; vim-modes-return
bind -T prefix V split-window -h -c "#{pane_current_path}" \; vim-modes-return

# windows
bind -T prefix c new-window \; vim-modes-return
# kill: lowercase the pane, uppercase the whole window (stock tmux puts the
# latter on `&`, which still works). Both confirm first, on the status line.
#
# The return comes *before* the command here, which is backwards from every
# other binding in this table and has to be: confirm-before suspends the rest
# of the command chain until the prompt is answered, and answering it with
# Escape drops what was still queued — so a trailing return never ran and
# cancelling a kill left you in INSERT. Running it first costs nothing (the
# prompt takes keys regardless of the key table) and covers both answers.
# command-prompt does not block this way, so `,` below keeps the normal order.
bind -T prefix x vim-modes-return \; confirm-before -p "kill pane #P? (y/n)" kill-pane
bind -T prefix X vim-modes-return \; confirm-before -p "kill window #W? (y/n)" kill-window
bind -T prefix w choose-window \; vim-modes-return
bind -T prefix n next-window \; vim-modes-return
bind -T prefix p previous-window \; vim-modes-return
bind -T prefix z resize-pane -Z \; vim-modes-return
bind -T prefix , command-prompt -I "#W" "rename-window '%%'" \; vim-modes-return
bind -T prefix 1 select-window -t :1 \; vim-modes-return
bind -T prefix 2 select-window -t :2 \; vim-modes-return
bind -T prefix 3 select-window -t :3 \; vim-modes-return
bind -T prefix 4 select-window -t :4 \; vim-modes-return
bind -T prefix 5 select-window -t :5 \; vim-modes-return
bind -T prefix 6 select-window -t :6 \; vim-modes-return
bind -T prefix 7 select-window -t :7 \; vim-modes-return
bind -T prefix 8 select-window -t :8 \; vim-modes-return
bind -T prefix 9 select-window -t :9 \; vim-modes-return
bind -T prefix 0 select-window -t :0 \; vim-modes-return

# sessions / misc
bind -T prefix d detach-client

# ---------------------------------------------------------------------------
# VISUAL (copy-mode)
# ---------------------------------------------------------------------------
#
# Nothing here re-arms a key table by hand — every exit below ends the pane
# mode, and pane-mode-changed puts the client back in NORMAL. There is
# deliberately no binding from here into INSERT (requirement 3); Escape lands
# in NORMAL, exactly like real vim.
#
# tmux's vi defaults bind Escape to clear-selection (deselect but stay in
# copy-mode), which would leave VISUAL with no way out but q; rebind it to
# actually cancel. Selection keys are spelled out because tmux only ships
# `Space`/`Enter` for begin-selection/copy by default.
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
