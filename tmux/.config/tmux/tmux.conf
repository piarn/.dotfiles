# Run fish in panes without touching the login shell (chsh) — mirrors how
# foot/other terminals here launch fish directly instead of relying on $SHELL.
run-shell "tmux set-option -g default-shell \"$(command -v fish)\""

# The leader, in NORMAL mode. vim-modes takes this key over and then parks the
# option itself on None — see plugins/vim-modes/README.md — so set the key here
# rather than deleting the line if you want to change it.
set -g prefix Space

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -sg terminal-overrides ",*:RGB"

# stop programs (fish, various CLIs) auto-renaming windows behind your back
set -g allow-rename off

# handle multiple clients on the same session at different terminal sizes
# sanely (fit to the smallest *active* client's window, not just any client)
setw -g aggressive-resize on

# confirmation messages (e.g. "config reloaded") default to disappearing
# in 750ms — too fast to actually read
set -g display-time 2000

# Theme (~/.rice) — status bar / pane border / message colors
source-file ~/.rice/tmux/theme.conf

# vim-modes prepends its NORMAL/VISUAL/INSERT indicator to this. Plain text on
# both counts — no styling, rice will handle that.
set -g status-left "[#S] "
set -g status-left-length 40

# Git branch of the active pane's cwd, moved here from the fish prompt so the
# prompt stays dir-only. Empty (no parens shown) outside a repo.
set -g status-right "#(git -C #{pane_current_path} branch --show-current 2>/dev/null | sed 's/^/(/;s/$/)/')"
set -g status-interval 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# real system-clipboard yank (xclip/wl-copy/win32yank auto-detected —
# works across Ubuntu, Fedora and WSL) instead of only tmux's own buffer
set -g @plugin 'tmux-plugins/tmux-yank'

# Persistence across reboots: resurrect saves/restores sessions, continuum
# autosaves and restores on server start. Must load after status-right is set
# (continuum hooks into it for its autosave timer).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim lazygit'

run '~/.tmux/plugins/tpm/tpm'

# Window/pane/session management lives on the direct Alt chords at the bottom;
# the leader (vim-modes) is for modes, hjkl and a few one-offs. Drop tmux's
# stock leader keys for the same jobs so they don't linger there.
unbind -T prefix c
unbind -T prefix n
unbind -T prefix p
unbind -T prefix l
unbind -T prefix w
unbind -T prefix x
unbind -T prefix &
unbind -T prefix z
unbind -T prefix ,
unbind -T prefix s
unbind -T prefix %
unbind -T prefix '"'
unbind -T prefix 0
unbind -T prefix 1
unbind -T prefix 2
unbind -T prefix 3
unbind -T prefix 4
unbind -T prefix 5
unbind -T prefix 6
unbind -T prefix 7
unbind -T prefix 8
unbind -T prefix 9

# Normal/Visual/Insert modes. Local plugin, not TPM-managed (nothing to fetch),
# but loaded like one — and deliberately *after* TPM, so where it and another
# plugin bind the same key (tmux-yank owns copy-mode's `y`), this one wins.
# See plugins/vim-modes/README.md for the mode model and the options below.
run '~/.config/tmux/plugins/vim-modes/vim-modes.tmux'

# tmux-sessionizer: session/window/pane tree popup. Registers a `sessionizer`
# command alias (binds nothing itself), used below.
run '~/.config/tmux/plugins/tmux-sessionizer/sessionizer.tmux'

# Direct chords, no prefix, mixing browser tab keys (Firefox/Chrome) and
# zellij's Alt layer with the vim-modes hjkl. They exist only in NORMAL
# (vim-normal table) and VISUAL (copy-mode-vi table); INSERT has none, so
# programs in the pane get their Alt keys. NORMAL copies end in
# `vim-modes-return` (an alias vim-modes defines, hence this block living after
# the vim-modes `run`); VISUAL ones don't, since leaving the pane mode is what
# returns the client to NORMAL.

# windows — browser tabs (Firefox/Chrome)
bind -T vim-normal M-1 select-window -t :1 \; vim-modes-return
bind -T copy-mode-vi M-1 select-window -t :1
bind -T vim-normal M-2 select-window -t :2 \; vim-modes-return
bind -T copy-mode-vi M-2 select-window -t :2
bind -T vim-normal M-3 select-window -t :3 \; vim-modes-return
bind -T copy-mode-vi M-3 select-window -t :3
bind -T vim-normal M-4 select-window -t :4 \; vim-modes-return
bind -T copy-mode-vi M-4 select-window -t :4
bind -T vim-normal M-5 select-window -t :5 \; vim-modes-return
bind -T copy-mode-vi M-5 select-window -t :5
bind -T vim-normal M-6 select-window -t :6 \; vim-modes-return
bind -T copy-mode-vi M-6 select-window -t :6
bind -T vim-normal M-7 select-window -t :7 \; vim-modes-return
bind -T copy-mode-vi M-7 select-window -t :7
bind -T vim-normal M-8 select-window -t :8 \; vim-modes-return
bind -T copy-mode-vi M-8 select-window -t :8
bind -T vim-normal M-9 select-window -t :$ \; vim-modes-return
bind -T copy-mode-vi M-9 select-window -t :$
bind -T vim-normal M-, previous-window \; vim-modes-return
bind -T copy-mode-vi M-, previous-window
bind -T vim-normal M-. next-window \; vim-modes-return
bind -T copy-mode-vi M-. next-window
bind -T vim-normal M-Tab last-window \; vim-modes-return
bind -T copy-mode-vi M-Tab last-window
bind -T vim-normal M-t new-window -c "#{pane_current_path}" \; vim-modes-return
bind -T copy-mode-vi M-t new-window -c "#{pane_current_path}"
bind -T vim-normal M-r command-prompt -I "#W" "rename-window '%%'" \; vim-modes-return
bind -T copy-mode-vi M-r command-prompt -I "#W" "rename-window '%%'"
bind -T vim-normal M-W display-popup -E -w 62 -h 9 -b rounded -S "fg=#{?#{@rice-red},#{@rice-red},red}" -T " kill window " "$HOME/.config/tmux/scripts/confirm-kill.sh window" \; vim-modes-return
bind -T copy-mode-vi M-W display-popup -E -w 62 -h 9 -b rounded -S "fg=#{?#{@rice-red},#{@rice-red},red}" -T " kill window " "$HOME/.config/tmux/scripts/confirm-kill.sh window"
bind -T vim-normal M-i swap-window -t :-1 \; select-window -t :-1 \; vim-modes-return
bind -T copy-mode-vi M-i swap-window -t :-1 \; select-window -t :-1
bind -T vim-normal M-o swap-window -t :+1 \; select-window -t :+1 \; vim-modes-return
bind -T copy-mode-vi M-o swap-window -t :+1 \; select-window -t :+1

# panes — zellij
bind -T vim-normal M-h select-pane -L \; vim-modes-return
bind -T copy-mode-vi M-h select-pane -L
bind -T vim-normal M-j select-pane -D \; vim-modes-return
bind -T copy-mode-vi M-j select-pane -D
bind -T vim-normal M-k select-pane -U \; vim-modes-return
bind -T copy-mode-vi M-k select-pane -U
bind -T vim-normal M-l select-pane -R \; vim-modes-return
bind -T copy-mode-vi M-l select-pane -R
bind -T vim-normal M-n if -F "#{>:#{pane_width},#{e|*:2,#{pane_height}}}" 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"' \; vim-modes-return
bind -T copy-mode-vi M-n if -F "#{>:#{pane_width},#{e|*:2,#{pane_height}}}" 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'
bind -T vim-normal M-\\ split-window -h -c "#{pane_current_path}" \; vim-modes-return
bind -T copy-mode-vi M-\\ split-window -h -c "#{pane_current_path}"
bind -T vim-normal M-- split-window -v -c "#{pane_current_path}" \; vim-modes-return
bind -T copy-mode-vi M-- split-window -v -c "#{pane_current_path}"
bind -T vim-normal M-w display-popup -E -w 62 -h 9 -b rounded -S "fg=#{?#{@rice-red},#{@rice-red},red}" -T " kill pane " "$HOME/.config/tmux/scripts/confirm-kill.sh pane" \; vim-modes-return
bind -T copy-mode-vi M-w display-popup -E -w 62 -h 9 -b rounded -S "fg=#{?#{@rice-red},#{@rice-red},red}" -T " kill pane " "$HOME/.config/tmux/scripts/confirm-kill.sh pane"
bind -T vim-normal M-f resize-pane -Z \; vim-modes-return
bind -T copy-mode-vi M-f resize-pane -Z
bind -T vim-normal M-H resize-pane -L 5 \; vim-modes-return
bind -T copy-mode-vi M-H resize-pane -L 5
bind -T vim-normal M-J resize-pane -D 5 \; vim-modes-return
bind -T copy-mode-vi M-J resize-pane -D 5
bind -T vim-normal M-K resize-pane -U 5 \; vim-modes-return
bind -T copy-mode-vi M-K resize-pane -U 5
bind -T vim-normal M-L resize-pane -R 5 \; vim-modes-return
bind -T copy-mode-vi M-L resize-pane -R 5

# sessions
bind -T vim-normal M-s sessionizer \; vim-modes-return
bind -T copy-mode-vi M-s sessionizer
bind -T vim-normal M-S switch-client -l \; vim-modes-return
bind -T copy-mode-vi M-S switch-client -l

# Ctrl+click opens the URL under the pointer (OSC 8 link, or plain text found
# in the clicked row). Mouse, not a chord, so it's bound in INSERT too. A plain
# click stays with tmux (focus/select). Terminal-side Ctrl+Shift+click never
# reaches a program that has the mouse, hence this.
bind -n C-MouseDown1Pane run-shell -b "$HOME/.config/tmux/scripts/open-url.sh h#{q:mouse_hyperlink} l#{q:mouse_line} x#{mouse_x}"
bind -T vim-normal C-MouseDown1Pane run-shell -b "$HOME/.config/tmux/scripts/open-url.sh h#{q:mouse_hyperlink} l#{q:mouse_line} x#{mouse_x}" \; vim-modes-return
bind -T copy-mode-vi C-MouseDown1Pane run-shell -b "$HOME/.config/tmux/scripts/open-url.sh h#{q:mouse_hyperlink} l#{q:mouse_line} x#{mouse_x}"

# let the server pick up the Wayland session from whichever client attaches
set -ga update-environment " WAYLAND_DISPLAY SWAYSOCK"
